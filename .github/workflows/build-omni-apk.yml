name: Build OMNI Terminal APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OMNI Terminal Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleDebug

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-Terminal-Debug-APKs
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          title: "OMNI Terminal ${{ github.ref_name }}"
          body: |
            ## 📱 OMNI Terminal Release ${{ github.ref_name }}
            
            Welcome to **OMNI Terminal** — the custom mobile command center running the OMNI Command Suite out of the box.
            
            ### ⬇️ Download & Install:
            - **arm64-v8a** (Recommended for Samsung S24 & modern phones): Download `app-arm64-v8a-debug.apk` or `app-universal-debug.apk`.
            - Install on your device and launch your multi-device command center!
          draft: false
          prerelease: false
